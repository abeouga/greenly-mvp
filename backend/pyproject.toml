[project]
name = "greenly-api"
version = "0.2.0"
description = "Local manual garden editor API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2,<3",
  "sqlalchemy>=2.0,<2.1",
  "pymysql[rsa]>=1.1,<2",
  "alembic>=1.13,<2",
  "pillow>=11,<13",
]

[dependency-groups]
dev = ["ruff>=0.9,<1"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
